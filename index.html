<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eloqui - Private AI Writing Assistant & Block Editor</title>
  <meta name="description" content="A Notion-style block editor with Linguix-style intelligent grammar and style suggestions, BYOK zero-knowledge privacy, custom model integration, and writing productivity analytics.">
  <meta property="og:title" content="Eloqui - Private AI Writing Assistant & Block Editor">
  <meta property="og:description" content="A Notion-style block editor with Linguix-style intelligent grammar and style suggestions, BYOK zero-knowledge privacy, custom model integration, and writing productivity analytics.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
  <!-- Added typography plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Merriweather', 'serif'],
          },
          colors: {
            brand: {
              50: '#f5f3ff',
              100: '#ede9fe',
              500: '#8b5cf6',
              600: '#7c3aed',
              900: '#4c1d95',
            }
          },
          animation: {
            'bounce-slow': 'bounce 3s infinite',
            'fade-in-up': 'fadeInUp 0.2s ease-out forwards',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          },
          boxShadow: {
            'card': '0 10px 40px -10px rgba(0,0,0,0.15), 0 0 10px -5px rgba(0,0,0,0.05)',
          }
        }
      }
    }
  </script>
  <style>
    /* Custom scrollbar for minimalism */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #e5e7eb;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d1d5db;
    }
    .empty-block:empty:before {
      content: 'Type "/" for commands...';
      color: #9ca3af;
      pointer-events: none;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    
    .mask-gradient-right {
      -webkit-mask-image: linear-gradient(to right, black 90%, transparent 100%);
      mask-image: linear-gradient(to right, black 90%, transparent 100%);
    }

    /* Review Mode Highlights - Linguix/Grammarly Style */
    .review-highlight {
      cursor: pointer;
      border-bottom: 2px solid;
      transition: all 0.2s ease;
      border-radius: 2px;
      padding-bottom: 1px;
    }
    .review-highlight:hover {
      opacity: 0.8;
    }
    
    /* Error (Grammar, Spelling) - Red */
    .review-error {
      border-bottom-color: #ef4444; 
      background-color: rgba(254, 226, 226, 0.5); 
    }
    
    /* Style (Tone, Vocabulary) - Purple */
    .review-style {
      border-bottom-color: #8b5cf6; 
      background-color: rgba(237, 233, 254, 0.5); 
    }
    
    /* Clarity (Conciseness) - Blue */
    .review-clarity {
      border-bottom-color: #0ea5e9; 
      background-color: rgba(224, 242, 254, 0.5); 
    }
    
    /* Alternatives - Emerald */
    .review-alternative {
      border-bottom-color: #10b981; 
      background-color: rgba(209, 250, 229, 0.5); 
    }

    .review-active {
      background-color: #fbbf24; /* Amber highlight when selected */
      border-bottom-color: #d97706;
      color: #000;
    }

    /* Markdown Styles */
    .markdown-body {
      font-size: 0.925rem;
      line-height: 1.6;
    }
    .markdown-body p { margin-bottom: 0.75em; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { 
      font-weight: 600; 
      margin-top: 1em; 
      margin-bottom: 0.5em; 
      color: #111827; 
    }
    .markdown-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 0.75em; }
    .markdown-body pre { 
      background-color: #f3f4f6; 
      padding: 0.75em; 
      border-radius: 0.5em; 
      overflow-x: auto; 
      margin-bottom: 0.75em;
      border: 1px solid #e5e7eb;
    }
    .markdown-body code { 
      font-family: monospace; 
      background-color: #f3f4f6; 
      padding: 0.1em 0.3em; 
      border-radius: 0.25em; 
      font-size: 0.9em;
    }
    .markdown-body pre code { 
      background-color: transparent; 
      padding: 0; 
      font-size: 0.85em;
    }
    .markdown-body blockquote { 
      border-left: 3px solid #e5e7eb; 
      padding-left: 1em; 
      color: #4b5563; 
      font-style: italic;
      margin-bottom: 0.75em;
    }
    .markdown-body a { color: #4f46e5; text-decoration: underline; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin-bottom: 0.75em; font-size: 0.85em; }
    .markdown-body th, .markdown-body td { border: 1px solid #e5e7eb; padding: 0.5em; text-align: left; }
    .markdown-body th { background-color: #f9fafb; font-weight: 600; }

    /* Censorship & Redaction Styles */
    .censored-spoiler {
      background-color: #374151;
      color: transparent !important;
      border-radius: 3px;
      padding: 1px 4px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      display: inline-block;
    }
    .censored-spoiler:hover, .censored-spoiler.revealed {
      background-color: #f3f4f6;
      color: #1f2937 !important;
      user-select: text;
    }
    .censored-blackbar {
      background-color: #030712;
      color: transparent !important;
      border-radius: 2px;
      padding: 0 4px;
      user-select: none;
      display: inline-block;
    }
    .censored-blur {
      filter: blur(5px);
      user-select: none;
      transition: filter 0.2s ease;
      display: inline-block;
    }
    .censored-blur:hover {
      filter: none;
      user-select: text;
    }
    .censored-pill {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px dashed #f87171;
      border-radius: 9999px;
      padding: 1px 6px;
      font-size: 0.85em;
      font-weight: 500;
      display: inline-block;
    }
    .censored-asterisks {
      letter-spacing: 2px;
      font-weight: 700;
      color: #6b7280;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "rxjs": "https://esm.sh/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://esm.sh/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://esm.sh/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://esm.sh/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://esm.sh/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://esm.sh/rxjs@^7.8.2/fetch?conditions=es2015",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0?external=rxjs",
    "@angular/common": "https://esm.sh/@angular/common@^21.1.0?external=rxjs",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@^21.1.0?external=rxjs",
    "@angular/forms": "https://esm.sh/@angular/forms@^21.1.0?external=rxjs",
    "@angular/core": "https://esm.sh/@angular/core@^21.1.0?external=rxjs",
    "@angular/compiler": "https://esm.sh/@angular/compiler@^21.1.0?external=rxjs",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "marked": "https://esm.sh/marked@12.0.0"
  }
}
</script>
</head>
<body class="bg-[#fcfcfc] text-gray-900 h-screen w-screen overflow-hidden">
  <app-root></app-root>
</body>
</html>
